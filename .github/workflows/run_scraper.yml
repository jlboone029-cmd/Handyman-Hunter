name: Handyman Hunter Scraper

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser geopy

      - name: Run Job Hunter Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python handyman_hunter.py

      - name: Commit and Push Updated Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add dual_leads_history.json leads_dashboard.html || true
          git commit -m "Automated Sync: Update live leads dashboard [skip ci]" || true
          git push
