name: Run Handyman Hunter Scraper

on:
  workflow_dispatch:
  schedule:
    # 🎯 Runs on standard UTC calculations matching your New York targets
    # 7:00 AM, 1:00 PM, 5:00 PM EST 
    - cron: '0 12,18,22 * * *'
    # 8:30 AM, 8:30 PM EST
    - cron: '30 13 * * *'
    - cron: '30 1 * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added 'json' fallback compatibility and core libraries
          pip install requests feedparser geopy

      - name: Execute Scraper Script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python handyman_hunter.py

      - name: Automatically Commit and Push Updated Dashboard
        run: |
          git config --global user.name "GitHub Actions Automation"
          git config --global user.email "actions@github.com"
          
          # Force tracking on files even if they are in your .gitignore
          git add -f dual_leads_history.json leads_dashboard.html || true
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update: Tactical console refreshed"
            git push origin HEAD:${{ github.ref_name }}
          fi


